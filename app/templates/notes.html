{% extends "base.html" %}
{% block content %}
<h1>Notes</h1>

{% with messages = get_flashed_messages() %}
    {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
{% endwith %}

<form id="add-note-form">
    <input type="text" id="note-title-input" name="title" placeholder="Title" required>
    <textarea id="note-content-input" name="content" rows="5"></textarea>
    <button type="submit">Save</button>
</form>

<div id="notes-container">
    <!-- notes inserted by JavaScript -->
</div>

<script>
    async function loadNotes() {
        const res = await fetch('/api/v1/notes');
        const result = await res.json();
        const divbody = document.getElementById('notes-container');
        divbody.innerHTML = '';

        result.data.forEach(note => {
            const div = document.createElement('div');
        div.innerHTML = `
            <div>${note.rendered_content}</div>
            <input type="text" id="title-${note.id}" value="${note.title}">
            <textarea id="content-${note.id}" rows="5">${note.content}</textarea>
            <button onclick="updateNote(${note.id})">Update</button>
            <button onclick="deleteNote(${note.id})">Delete</button>
        `;
            divbody.appendChild(div);
        });
    }

    document.getElementById('add-note-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const noteTitle = document.getElementById('note-title-input').value;
        const noteContent = document.getElementById('note-content-input').value;

        const res = await fetch('/api/v1/notes', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title: noteTitle, content: noteContent})
        });
        const result = await res.json();

        if (result.success) {
            document.getElementById('note-title-input').value = '';
            loadNotes();
        } else {
            alert(result.error);
        }
    });

    async function updateNote(id) {
        const noteTitle = document.getElementById(`title-${id}`).value;
        const noteContent = document.getElementById(`content-${id}`).value;

        const res = await fetch(`/api/v1/notes/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title: noteTitle, content: noteContent})
        });
        const result = await res.json();

        if (result.success) {
            loadNotes();
        } else {
            alert(result.error);
        }
    }

    async function deleteNote(id) {
        if (!confirm('Delete this note?')) return;
        await fetch(`/api/v1/notes/${id}`, { method: 'DELETE' });
        loadNotes();
    }
    loadNotes();
</script>
{% endblock %}
