{% extends "base.html" %}
{% block content %}
<h1>Profile</h1>

{% with messages = get_flashed_messages() %}
    {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
{% endwith %}

<form id="profile-form">
    <input type="text" id="profile-name-input" name="full_name" placeholder="Full name">
    <input type="text" id="profile-email-input" name="email" placeholder="Email">
    <textarea id="profile-bio-input" name="bio" rows="5"></textarea>
    <button type="submit">Save</button>
</form>

<h2>Change Password</h2>
<form id="password-form">
    <input type="password" id="current-password-input" placeholder="Current password" required>
    <input type="password" id="new-password-input" placeholder="New password" required>
    <input type="password" id="confirm-password-input" placeholder="Confirm new password" required>
    <button type="submit">Change Password</button>
</form>

<script>
    async function loadProfile() {
        const res = await fetch('/api/v1/profile');
        const result = await res.json();
        const profile = result.data;

        document.getElementById('profile-name-input').value = profile.full_name || '';
        document.getElementById('profile-email-input').value = profile.email || '';
        document.getElementById('profile-bio-input').value = profile.bio || '';
    }

    document.getElementById('profile-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const fullName = document.getElementById('profile-name-input').value;
        const email = document.getElementById('profile-email-input').value;
        const bio = document.getElementById('profile-bio-input').value;

        const res = await fetch('/api/v1/profile', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({full_name: fullName, email: email, bio: bio})
        });
        const result = await res.json();

        if (result.success) {
            loadProfile();
        } else {
            alert(result.error);
        }
    });
    loadProfile();

    document.getElementById('password-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const currentPassword = document.getElementById('current-password-input').value;
        const newPassword = document.getElementById('new-password-input').value;
        const confirmPassword = document.getElementById('confirm-password-input').value;

        if (newPassword !== confirmPassword) {
            alert('New password and confirmation do not match.');
            return;
        }

        const res = await fetch('/api/v1/profile/password', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({current_password: currentPassword, new_password: newPassword})
        });
        const result = await res.json();

        if (result.success) {
            alert('Password changed successfully.');
            document.getElementById('password-form').reset();
        } else {
            alert(result.error);
        }
    });
</script>
{% endblock %}
