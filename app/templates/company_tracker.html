{% extends "base.html" %}
{% block content %}
    <h1>Company Tracker</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <form id="add-company-form">
        <input type="text" id="company-name-input" name="company_name" placeholder="Company name" required>
        <select name="status" id="add-status-input">
            <option value="Applied">Applied</option>
            <option value="OA">OA</option>
            <option value="Interview">Interview</option>
            <option value="Rejected">Rejected</option>
            <option value="Selected">Selected</option>
        </select>
        <button type="submit">Add Company</button>
    </form>

    <table id="companies-table">
        <tr>
            <th>Company</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        <tbody id="companies-tbody">
            <!--Rows inserted by JavaScript-->
        </tbody>
    </table>

<script>
    async function loadCompanies(){
        const res = await fetch('/api/v1/companies');
        const result = await res.json();
        const tbody = document.getElementById('companies-tbody');
        tbody.innerHTML = '';

        result.data.forEach(company => {
            const row = document.createElement('tr');
        row.innerHTML = `
            <td>${company.company_name}</td>
            <td>
                <select id="status-${company.id}">
                    <option value="Applied" ${company.status === 'Applied' ? 'selected' : ''}>Applied</option>
                    <option value="OA" ${company.status === 'OA' ? 'selected' : ''}>OA</option>
                    <option value="Interview" ${company.status === 'Interview' ? 'selected' : ''}>Interview</option>
                    <option value="Rejected" ${company.status === 'Rejected' ? 'selected' : ''}>Rejected</option>
                    <option value="Selected" ${company.status === 'Selected' ? 'selected' : ''}>Selected</option>
                </select>
            </td>
            <td><button onclick="deleteCompany(${company.id})">Delete</button><button onclick="updateCompany(${company.id})">Update</button></td>
        `;
            tbody.appendChild(row);
        });
    }

    document.getElementById('add-company-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const companyName = document.getElementById('company-name-input').value;
        const status = document.getElementById('add-status-input').value;

        const res = await fetch('/api/v1/companies', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({company_name: companyName, status: status})
        });
        const result = await res.json();

        if (result.success) {
            document.getElementById('company-name-input').value = '';
            loadCompanies();
        } else {
            alert(result.error);
        }
    });

    async function updateCompany(id) {
        const status = document.getElementById(`status-${id}`).value;

        const res = await fetch(`/api/v1/companies/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({status: status})
        });
        const result = await res.json();

        if (result.success) {
            loadCompanies();
        } else {
            alert(result.error);
        }
    }

    async function deleteCompany(id) {
        if (!confirm('Delete this company?')) return;
        await fetch(`/api/v1/companies/${id}`, { method: 'DELETE' });
        loadCompanies();
    }
    loadCompanies();
</script>

{% endblock %}
